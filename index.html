
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PD自主RAS訓練測試版</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #1565c0;
    }
    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background-color: #0288d1;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
    .question-block {
      display: none;
      flex-direction: column;
      margin-top: 20px;
    }
    .question {
      margin: 10px 0;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>PD自主RAS訓練測試版</h1>
  <button id="startBtn">開始測試</button>

  <div id="playerSection" class="hidden">
    <audio id="musicPlayer" controls></audio>

    <form id="feedbackForm" class="question-block">
      <div class="question">
        <label>1. 你覺得這段音樂是否讓你覺得「輕鬆」？</label><br />
        <label><input type="radio" name="relaxing" value="是" required> 是</label>
        <label><input type="radio" name="relaxing" value="否"> 否</label>
      </div>
      <div class="question">
        <label>2. 你覺得「是否容易跟上節奏」？</label><br />
        <label><input type="radio" name="followable" value="容易" required> 容易</label>
        <label><input type="radio" name="followable" value="困難"> 困難</label>
      </div>
      <button type="submit">提交回饋</button>
    </form>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "你的API金鑰",
      authDomain: "你的專案ID.firebaseapp.com",
      projectId: "你的專案ID",
      storageBucket: "你的專案ID.appspot.com",
      messagingSenderId: "訊息ID",
      appId: "你的AppID"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ✅ 匿名登入
    firebase.auth().signInAnonymously()
      .then(() => console.log("✅ 匿名登入成功"))
      .catch((error) => console.error("❌ 匿名登入失敗", error));

    const musicList = ["high.mp3", "drum.mp3"];
    let currentTrack = 0;
    let userId = localStorage.getItem("userId") || crypto.randomUUID();
    localStorage.setItem("userId", userId);

    const startBtn = document.getElementById("startBtn");
    const musicPlayer = document.getElementById("musicPlayer");
    const playerSection = document.getElementById("playerSection");
    const feedbackForm = document.getElementById("feedbackForm");

    startBtn.addEventListener("click", () => {
      startBtn.style.display = "none";
      playerSection.classList.remove("hidden");
      playTrack(currentTrack);
    });

    function playTrack(index) {
      if (index >= musicList.length) {
        playerSection.innerHTML = "<h2>測試完成，感謝您的參與！</h2>";
        return;
      }
      feedbackForm.reset();
      feedbackForm.style.display = "none";
      musicPlayer.src = musicList[index];
      musicPlayer.play();
    }

    musicPlayer.addEventListener("ended", () => {
      feedbackForm.style.display = "flex";
    });

    feedbackForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const relaxing = feedbackForm.elements["relaxing"].value;
      const followable = feedbackForm.elements["followable"].value;

      try {
        await db.collection("rasFeedback").add({
          userId,
          track: musicList[currentTrack],
          relaxing,
          followable,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        currentTrack++;
        playTrack(currentTrack);
      } catch (error) {
        alert("❌ 提交失敗：" + error.message);
        console.error(error);
      }
    });
  </script>
</body>
</html>
