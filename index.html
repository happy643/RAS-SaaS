
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PD自主RAS訓練測試版</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #0077b6;
    }
    button {
      margin: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background-color: #00b4d8;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
    #instructions, #feedbackForm, #thankYou {
      display: none;
      margin-top: 20px;
    }
  </style>

  <!-- ✅ Firebase CDN (compat 版本) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>PD自主RAS訓練測試版</h1>
  <button id="startBtn">開始測試</button>

  <div id="instructions"></div>

  <!-- 播放器 -->
  <audio id="musicPlayer" controls style="margin-top: 20px;"></audio>

  <!-- 簡單問卷 -->
  <div id="feedbackForm">
    <p>請問這段音樂讓你覺得：</p>
    <button onclick="submitFeedback('easy')">輕鬆</button>
    <button onclick="submitFeedback('difficult')">困難</button>
  </div>

  <div id="thankYou">
    <p>感謝您的回饋！</p>
  </div>

  <script>
    // ✅ Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyC7m4kUocqpqZzEwcPjqkxNnq7waoTo9zE",
      authDomain: "pd-ras-training.firebaseapp.com",
      projectId: "pd-ras-training",
      storageBucket: "pd-ras-training.appspot.com",
      messagingSenderId: "167154212913",
      appId: "1:167154212913:web:762789c19c35958094f510"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    // ✅ 匿名 userId 儲存
    const userId = localStorage.getItem("userId") || crypto.randomUUID();
    localStorage.setItem("userId", userId);

    // ✅ 音樂與流程控制
    let stage = 0;
    const lowFreqMusic = './drum.mp3';
    const highFreqMusic = './high.mp3';

    const startBtn = document.getElementById('startBtn');
    const instructions = document.getElementById('instructions');
    const musicPlayer = document.getElementById('musicPlayer');
    const feedbackForm = document.getElementById('feedbackForm');
    const thankYou = document.getElementById('thankYou');

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      startTraining();
    });

    function startTraining() {
      if (stage === 0) {
        instructions.innerText = '請戴上耳機，播放低頻音樂，並跟著節奏走約1-2分鐘';
        instructions.style.display = 'block';
        musicPlayer.src = lowFreqMusic;
        musicPlayer.play();
        stage = 1;

        musicPlayer.onended = () => {
          instructions.innerText = '接下來播放第二段音樂，請繼續走動';
          musicPlayer.src = highFreqMusic;
          musicPlayer.play();
          stage = 2;
        };
      } else if (stage === 2) {
        musicPlayer.onended = () => {
          instructions.style.display = 'none';
          feedbackForm.style.display = 'block';
        };
      }
    }

    function submitFeedback(feeling) {
      db.collection("rasFeedback").add({
        userId: userId,
        feeling: feeling,
        timestamp: new Date()
      }).then(() => {
        feedbackForm.style.display = 'none';
        thankYou.style.display = 'block';
      });
    }
  </script>
</body>
</html>
