
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PD自主RAS訓練測試版</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f7fa;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #1565c0;
    }
    button {
      font-size: 18px;
      padding: 15px 30px;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }
    #feedbackForm {
      margin-top: 20px;
      text-align: left;
      display: none;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .question {
      margin-bottom: 20px;
    }
    label {
      margin-right: 15px;
    }
    #thankYou {
      font-size: 22px;
      color: green;
      margin-top: 30px;
      display: none;
    }
    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>PD自主RAS訓練測試版</h1>

  <button id="startBtn">開始測試</button>

  <audio id="musicPlayer" controls style="display: none;"></audio>

  <form id="feedbackForm">
    <div class="question">
      <p>1. 你覺得這段音樂是否讓你覺得「輕鬆」？</p>
      <label><input type="radio" name="q1" value="yes"> 是</label>
      <label><input type="radio" name="q1" value="no"> 否</label>
    </div>
    <div class="question">
      <p>2. 你覺得「是否容易跟上節奏」？</p>
      <label><input type="radio" name="q2" value="easy"> 容易</label>
      <label><input type="radio" name="q2" value="difficult"> 困難</label>
    </div>
    <button type="button" onclick="handleFeedbackSubmit()">提交回饋</button>
  </form>

  <div id="thankYou">感謝您的回饋，測試完成！</div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem("userId");
    if (!userId) {
      userId = crypto.randomUUID();
      localStorage.setItem("userId", userId);
    }

    firebase.auth().signInAnonymously().catch(console.error);

    let stage = 0;
    const musicList = ["./drum.mp3", "./high.mp3"];
    const startBtn = document.getElementById("startBtn");
    const musicPlayer = document.getElementById("musicPlayer");
    const feedbackForm = document.getElementById("feedbackForm");
    const thankYou = document.getElementById("thankYou");

    startBtn.addEventListener("click", () => {
      startBtn.style.display = "none";
      playNextMusic();
    });

    musicPlayer.addEventListener("ended", () => {
      feedbackForm.style.display = "block";
    });

    function playNextMusic() {
      musicPlayer.src = musicList[stage];
      musicPlayer.style.display = "block";
      musicPlayer.play();
    }

    async function handleFeedbackSubmit() {
      const q1 = document.querySelector('input[name="q1"]:checked')?.value;
      const q2 = document.querySelector('input[name="q2"]:checked')?.value;

      if (!q1 || !q2) {
        alert("請完整填寫問卷後再提交");
        return;
      }

      feedbackForm.style.display = "none";
      musicPlayer.style.display = "none";

      // 儲存至 Firebase
      try {
        await db.collection("feedbacks").add({
          userId,
          music: musicList[stage],
          q1,
          q2,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log("回饋已儲存");
      } catch (err) {
        console.error("儲存失敗:", err);
      }

      stage++;
      if (stage < musicList.length) {
        playNextMusic();
      } else {
        thankYou.style.display = "block";
      }
    }
  </script>
</body>
</html>
